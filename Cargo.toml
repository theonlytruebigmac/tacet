[package]
name = "tacet"
version = "0.1.0"
edition = "2021"
description = "Ultra-fast audio fingerprinting for intro/credit detection"
license = "MIT"

[lib]
name = "tacet"
path = "src/lib.rs"

[[bin]]
name = "tacet"
path = "src/main.rs"

[features]
default = ["api"]
api = ["dep:axum", "dep:tower-http"]

[dependencies]
# === Audio Decoding (pure Rust, no ffmpeg dependency) ===
symphonia = { version = "0.5", features = ["all"] }
rubato = "0.15"                    # high-quality resampling

# === DSP / Fingerprinting ===
rustfft = "6.2"                    # FFT engine (auto-selects AVX2/NEON)
num-complex = "0.4"

# === Storage ===
rusqlite = { version = "0.31", features = ["bundled"] }
bincode = "1.3"

# === Parallelism ===
rayon = "1.10"
tokio = { version = "1", features = ["full"] }

# === API (optional) ===
axum = { version = "0.7", optional = true }
tower-http = { version = "0.5", features = ["cors", "trace"], optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# === CLI ===
clap = { version = "4", features = ["derive"] }
shellexpand = "3"

# === Utilities ===
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "1"
anyhow = "1"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
tempfile = "3"

[[bench]]
name = "fingerprint_bench"
harness = false

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
