[workspace]
resolver = "2"
members = [
    "crates/tacet-core",
    "crates/tacet-api",
    "crates/tacet-cli",
]

[workspace.package]
version = "0.2.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/theonlytruebigmac/tacet"

[workspace.dependencies]
# Inter-crate deps — pin once here, reference by version in each crate.
tacet-core = { path = "crates/tacet-core", version = "0.2.0", default-features = false }
tacet-api  = { path = "crates/tacet-api",  version = "0.2.0" }

# Shared upstream deps
anyhow = "1"
thiserror = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Workspace-wide release profile. lto=fat + single codegen unit gives the
# tightest binary for the CLI and the smallest object code for callers
# linking the library.
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
