<svg width="100%" viewBox="0 0 680 720" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>Tacet audio fingerprinting architecture</title>
  <desc>Pipeline diagram showing the flow from media files through audio decoding, STFT, peak extraction, constellation hashing, reference bootstrap, O(n) fast matching, and boundary refinement to produce intro and credit markers.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      .heading { fill: #FAF9F5; font-family: -apple-system, "system-ui", "Segoe UI", sans-serif; font-size: 14px; font-weight: 500; }
      .subheading { fill: #C2C0B6; font-family: -apple-system, "system-ui", "Segoe UI", sans-serif; font-size: 12px; }
      .box-title { font-family: -apple-system, "system-ui", "Segoe UI", sans-serif; font-size: 14px; font-weight: 500; }
      .box-sub { font-family: -apple-system, "system-ui", "Segoe UI", sans-serif; font-size: 12px; }
      .annot { fill: #C2C0B6; font-family: -apple-system, "system-ui", "Segoe UI", sans-serif; font-size: 12px; }
      .flow { fill: none; stroke: #9C9A92; stroke-width: 1.5; }
      .flow-dashed { fill: none; stroke: #9C9A92; stroke-width: 1.5; stroke-dasharray: 4 3; }
    </style>
  </defs>

  <text x="340" y="38" text-anchor="middle" class="heading">Tacet pipeline</text>
  <text x="340" y="56" text-anchor="middle" class="subheading">O(n) season analysis vs Plex's O(n²)</text>

  <g>
    <rect x="220" y="76" width="240" height="56" rx="8" fill="#444441" stroke="#B4B2A9" stroke-width="0.5"/>
    <text x="340" y="96" text-anchor="middle" class="box-title" fill="#D3D1C7">Audio decoder</text>
    <text x="340" y="114" text-anchor="middle" class="box-sub" fill="#B4B2A9">symphonia — no ffmpeg</text>
  </g>

  <line x1="340" y1="132" x2="340" y2="156" marker-end="url(#arrow)" class="flow"/>

  <g>
    <rect x="220" y="156" width="240" height="56" rx="8" fill="#085041" stroke="#5DCAA5" stroke-width="0.5"/>
    <text x="340" y="176" text-anchor="middle" class="box-title" fill="#9FE1CB">STFT engine</text>
    <text x="340" y="194" text-anchor="middle" class="box-sub" fill="#5DCAA5">rustfft — AVX2/NEON auto</text>
  </g>

  <line x1="340" y1="212" x2="340" y2="236" marker-end="url(#arrow)" class="flow"/>

  <g>
    <rect x="220" y="236" width="240" height="56" rx="8" fill="#085041" stroke="#5DCAA5" stroke-width="0.5"/>
    <text x="340" y="256" text-anchor="middle" class="box-title" fill="#9FE1CB">Peak extraction</text>
    <text x="340" y="274" text-anchor="middle" class="box-sub" fill="#5DCAA5">6 log bands, local maxima</text>
  </g>

  <line x1="340" y1="292" x2="340" y2="316" marker-end="url(#arrow)" class="flow"/>

  <g>
    <rect x="220" y="316" width="240" height="56" rx="8" fill="#3C3489" stroke="#AFA9EC" stroke-width="0.5"/>
    <text x="340" y="336" text-anchor="middle" class="box-title" fill="#CECBF6">Constellation hashing</text>
    <text x="340" y="354" text-anchor="middle" class="box-sub" fill="#AFA9EC">Peak pairs → 32-bit tokens</text>
  </g>

  <text x="40" y="176" class="annot">First 10 min</text>
  <text x="40" y="194" class="annot">+ last 8 min</text>
  <line x1="116" y1="184" x2="218" y2="184" marker-end="url(#arrow)" class="flow-dashed"/>

  <text x="640" y="276" text-anchor="end" class="annot">rayon parallel</text>
  <text x="640" y="294" text-anchor="end" class="annot">per episode</text>
  <line x1="556" y1="284" x2="462" y2="284" marker-end="url(#arrow)" class="flow-dashed"/>

  <line x1="340" y1="372" x2="200" y2="420" marker-end="url(#arrow)" class="flow"/>
  <line x1="340" y1="372" x2="480" y2="420" marker-end="url(#arrow)" class="flow"/>

  <text x="220" y="406" text-anchor="middle" class="annot">3 episodes</text>
  <text x="460" y="406" text-anchor="middle" class="annot">n−3 episodes</text>

  <g>
    <rect x="80" y="420" width="240" height="56" rx="8" fill="#712B13" stroke="#F0997B" stroke-width="0.5"/>
    <text x="200" y="440" text-anchor="middle" class="box-title" fill="#F5C4B3">Reference bootstrap</text>
    <text x="200" y="458" text-anchor="middle" class="box-sub" fill="#F0997B">Cross-match → consensus</text>
  </g>

  <g>
    <rect x="360" y="420" width="240" height="56" rx="8" fill="#712B13" stroke="#F0997B" stroke-width="0.5"/>
    <text x="480" y="440" text-anchor="middle" class="box-title" fill="#F5C4B3">O(n) fast match</text>
    <text x="480" y="458" text-anchor="middle" class="box-sub" fill="#F0997B">Offset histogram + longest run</text>
  </g>

  <line x1="320" y1="448" x2="358" y2="448" marker-end="url(#arrow)" class="flow"/>
  <text x="339" y="442" text-anchor="middle" class="annot">ref</text>

  <line x1="200" y1="476" x2="200" y2="530" marker-end="url(#arrow)" class="flow"/>
  <line x1="480" y1="476" x2="480" y2="530" marker-end="url(#arrow)" class="flow"/>

  <g>
    <rect x="120" y="530" width="440" height="56" rx="8" fill="#633806" stroke="#EF9F27" stroke-width="0.5"/>
    <text x="340" y="550" text-anchor="middle" class="box-title" fill="#FAC775">Boundary refinement</text>
    <text x="340" y="568" text-anchor="middle" class="box-sub" fill="#EF9F27">RMS energy transitions → clean skip points</text>
  </g>

  <line x1="340" y1="586" x2="340" y2="620" marker-end="url(#arrow)" class="flow"/>

  <g>
    <rect x="180" y="620" width="320" height="56" rx="8" fill="#27500A" stroke="#97C459" stroke-width="0.5"/>
    <text x="340" y="640" text-anchor="middle" class="box-title" fill="#C0DD97">Segment markers</text>
    <text x="340" y="658" text-anchor="middle" class="box-sub" fill="#97C459">intro: 2.3s–63.8s | credits: 2812s–2855s</text>
  </g>

  <text x="640" y="550" text-anchor="end" class="annot">SQLite + bincode</text>
  <text x="640" y="568" text-anchor="end" class="annot">cache + persist</text>
  <line x1="562" y1="558" x2="560" y2="558" marker-end="url(#arrow)" class="flow-dashed"/>

  <rect x="40" y="696" width="8" height="8" rx="2" fill="#1D9E75" opacity="0.6"/>
  <text x="56" y="705" class="annot">~600ms/episode on release build</text>
</svg>
